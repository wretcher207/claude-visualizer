[package]
name = "prologue-listener"
version = "0.1.0"
description = "The app's local hook listener: takes Claude Code's HTTP hooks on 127.0.0.1 and keeps only what the scene uses"
license = "MIT"
edition = "2021"

# Kept out of the Tauri crate so it builds and tests on any machine with
# plain `cargo test -p prologue-listener`, no webview needed.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
